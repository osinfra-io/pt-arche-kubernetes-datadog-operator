name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  build_agent:
    name: Build custom Datadog Agent
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/build-and-push.yml@873e5eb069348e446ddc20c9c96661073d4bec42  # v0.3.5
    with:
      cache_from: type=gha
      cache_to: type=gha,mode=max
      context: images/agent-integrations-extra
      file: images/agent-integrations-extra/Dockerfile
      registry: us-docker.pkg.dev
      service_account: arche-datadog-image@pt-corpus-tf16-prod.iam.gserviceaccount.com
      tags: us-docker.pkg.dev/pt-corpus-tf16-prod/pt-pneuma-standard/datadog/agent-integrations-extra:${{ github.ref_name }}
      workload_identity_provider: projects/557265520053/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc

  release:
    name: Release
    needs: build_agent
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/release.yml@873e5eb069348e446ddc20c9c96661073d4bec42  # v0.3.5
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
